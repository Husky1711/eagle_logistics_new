name: CI

on:
  push:
    branches: [public-site, project-2, main]
  pull_request:
    branches: [public-site, project-2, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm install

      - name: Unit tests (public)
        run: npm test

      - name: Production build
        run: npm run build
